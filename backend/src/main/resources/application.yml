server:
  port: 8080

spring:
  application:
    name: tcm-exam-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcm_exam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"
  mapper-locations: classpath*:mapper/*.xml

jwt:
  secret: ${JWT_SECRET:tcm-exam-system-jwt-secret-key-2026-very-secure-and-long-enough-for-hs256-signing}
  expire-hours: 24

exam:
  anti-cheat:
    switch-limit: 3
  auto-submit:
    enabled: true
    cron: "0 * * * * *"   # 每分钟检查超时考试
