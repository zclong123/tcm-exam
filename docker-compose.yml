version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tcm-postgres
    environment:
      POSTGRES_DB: tcm_exam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/sql/seed_basic.sql:/docker-entrypoint-initdb.d/02-basic.sql:ro
      - ./backend/src/main/resources/sql/seed_questions.sql:/docker-entrypoint-initdb.d/03-questions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tcm-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: tcm-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tcm_exam
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: tcm-exam-system-jwt-secret-key-2026-very-secure-and-long-enough-for-hs256-signing
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: tcm-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  pgdata:
